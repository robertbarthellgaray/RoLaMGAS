# User approved automatic commits and website rebuilds on 2026-11-14.
name: Refresh JPL body names
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency:
  group: refresh-body-names
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tools -p 'test_body_names.py'
      - name: Resolve new targets and periodically recheck approved names
        run: python tools/refresh_body_names.py --live
      - name: Publish updated name catalogue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- docs/data/body_names.json; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/data/body_names.json
          git commit -m 'Refresh public small-body names from JPL'
          git pull --rebase origin main
          git push origin HEAD:main
          # GITHUB_TOKEN commits do not trigger legacy Pages builds alone.
          gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds"
